# RetroArch en la RG Slide: GLES por libhybris (contexto "hybris"), audio ALSA, entrada udev.
video_driver = "gl"
video_context_driver = "hybris"
video_fullscreen = "true"
video_windowed_fullscreen = "true"
video_fullscreen_x = "1280"
video_fullscreen_y = "960"
video_vsync = "true"
video_threaded = "false"
video_font_enable = "true"
video_smooth = "false"
audio_driver = "alsa"
audio_enable = "true"
audio_latency = "64"
input_driver = "udev"
input_joypad_driver = "udev"
joypad_autoconfig_dir = "/usr/share/rgslide/autoconfig"
menu_driver = "rgui"
menu_mouse_enable = "false"
pause_nonactive = "false"
config_save_on_exit = "false"
rgui_aspect_ratio = "1"
libretro_directory = "/opt/retroarch/lib/libretro"
libretro_info_path = "/opt/retroarch/share/info"
assets_directory = "/opt/retroarch/share/assets"
system_directory = "/opt/retroarch/system"
savefile_directory = "/opt/retroarch/saves"
savestate_directory = "/opt/retroarch/states"
rgui_browser_directory = "/home/console"
core_updater_auto_extract_archive = "false"
menu_show_online_updater = "false"
log_verbosity = "true"
