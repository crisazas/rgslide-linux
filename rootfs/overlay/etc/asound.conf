# Audio de la Slide: el PCM "default" escribe PCM crudo (S16_LE, 2 canales, 48000 Hz) en la FIFO que lee rgslide-audiod.
# El demonio es quien abre el PCM real del altavoz con las reglas medidas (buffer 96000 B, NO_PERIOD_WAKEUP); ver docs/agent-agdsp.md.
pcm.rgslide_fifo {
	type file
	slave.pcm "null"
	file "/run/rgslide/audio.fifo"
	format "raw"
	perm 0666
}
pcm.!default {
	type plug
	slave {
		pcm "rgslide_fifo"
		format S16_LE
		channels 2
		rate 48000
	}
}
ctl.!default {
	type hw
	card 0
}
