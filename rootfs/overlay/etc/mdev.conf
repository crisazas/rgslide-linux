# /dev sin devtmpfs (kernel de fabrica 5.4 sin CONFIG_DEVTMPFS): reglas para busybox mdev (rgslide-dev.service).
# Formato: regex usuario:grupo modo. Con "/" en la regex se compara la ruta completa (DEVNAME).
null            root:root   666
zero            root:root   666
full            root:root   666
random          root:root   666
urandom         root:root   666
tty             root:tty    666
ptmx            root:tty    666
console         root:tty    600
kmsg            root:root   644
tty[0-9]+       root:tty    620
ttyS[0-9]+      root:dialout 660
ttyGS[0-9]+     root:dialout 660
ttyUSB[0-9]+    root:dialout 660
fuse            root:root   666
rtc[0-9]+       root:root   664
dri/.*          root:video  666
mali0           root:render 666
ion             root:root   666
binder.*        root:root   666
dma_heap/.*     root:root   666
input/.*        root:input  660
snd/.*          root:audio  660
sd[a-z]+[0-9]*  root:disk   660
loop[0-9]+      root:disk   660
