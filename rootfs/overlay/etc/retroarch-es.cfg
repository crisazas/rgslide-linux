# Ajustes de audio de los juegos (lo añade rgslide-es-launch con --appendconfig). Se aplican DESPUES de /etc/retroarch.cfg,
# por eso el dispositivo se fija aquí y no allí: este fichero manda.
# audio_driver=alsa: unico driver con salida en esta build (sin Pulse ni PipeWire; --enable-alsa en scripts/build-retroarch.sh).
# audio_device=rgslide: PCM propio de /etc/asound.conf que escribe S16_LE estereo 48 kHz crudo en la FIFO de rgslide-audiod.
#   El demonio es el unico que abre el PCM real (pcmC0D2p, buffer 96000 B, NO_PERIOD_WAKEUP, reabre si hw_ptr se clava),
#   porque abrir el PCM real directo NO avanza sin NO_PERIOD_WAKEUP y sin eso RetroArch se queda en silencio.
#   NO usar "default": es un plug con resample, asi que RetroArch pide FLOAT (default de audio_format_negotiation) y el
#   convertidor de libasound mete ruido/redondeo extra antes de la FIFO. El PCM propio es un plug forzado a S16_LE sin resample.
# audio_out_rate=48000: la tasa del PCM de la FIFO y del DSP. Con "default" el rate se negociaba; aqui es exacto y sin resample.
# audio_latency=64: 64 ms de buffer en RetroArch (4 periodos de 16 ms). Por debajo de 60 el pipeline se queda corto frente a los
#   ~3 s de reapertura del demonio; por encima de 100 se nota el retardo del mando. El buffer real del DAC (96000 B = 1 s) lo pone el demonio.
# audio_sync=true: RetroArch ajusta su reloj al del dispositivo en vez de dejarlo correr; con una FIFO que puede descartar (ring_trim)
#   evita que la deriva llene el anillo.
# audio_format_negotiation=0 (Int16): la cadena entera es entera; sin esto RetroArch pide FLOAT en cualquier PCM plug.
audio_driver = "alsa"
audio_enable = "true"
audio_device = "rgslide"
audio_out_rate = "48000"
audio_latency = "64"
audio_sync = "true"
audio_format_negotiation = "0"
