# Configuracion de rgslide-fan (lo relee cada ciclo; no hace falta reiniciar el servicio)
# FAN_MODE: auto = curva por temperatura | off = parado | max = 255 | N = pwm fijo 0..255
# Con la temperatura >= FAN_SAFE ningun modo baja del nivel de la curva (el ventilador no se queda parado en caliente).
# Comando simple:  rgslide-fan mode auto|off|max|N     (reescribe la linea FAN_MODE)
FAN_MODE=auto
# FAN_CURVE=temperatura_C:pwm,... (sube al cruzar el umbral)
FAN_CURVE=45:90,52:140,58:200,64:255
# Grados de histeresis para bajar de nivel
FAN_HYST=4
# Segundos entre lecturas
FAN_PERIOD=3
# Suelo de seguridad en grados C
FAN_SAFE=58
