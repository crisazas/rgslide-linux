<?xml version="1.0"?>
<!-- Sistemas de la RG Slide: cada uno lanza RetroArch (rgslide-retroarch) con el nucleo instalado en /opt/retroarch/lib/libretro. -->
<systemList>
  <system>
    <name>gb</name>
    <fullname>Game Boy</fullname>
    <path>/home/console/roms/gb</path>
    <extension>.gb .GB .zip .ZIP</extension>
    <command>/usr/local/bin/rgslide-es-launch /opt/retroarch/lib/libretro/gambatte_libretro.so %ROM%</command>
    <platform>gb</platform>
    <theme>gb</theme>
  </system>
  <system>
    <name>gbc</name>
    <fullname>Game Boy Color</fullname>
    <path>/home/console/roms/gbc</path>
