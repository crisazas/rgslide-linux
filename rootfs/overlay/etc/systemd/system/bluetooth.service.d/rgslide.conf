[Unit]
# bluetoothd solo arranca con hci0 presente; lo arranca rgslide-bt-up (systemctl start --no-block bluetooth) cuando hci0 existe.
# Si el chip no responde, bluetooth.service queda "skipped" y no estorba al arranque.
ConditionPathExists=/sys/class/bluetooth/hci0
After=rgslide-bt.service
PartOf=rgslide-bt.service
