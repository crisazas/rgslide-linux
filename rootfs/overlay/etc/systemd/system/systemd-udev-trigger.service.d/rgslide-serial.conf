[Unit]
# Carrera medida (2026-11-26, 2 arranques caidos de 14): apsys_dvfs (modulo de fabrica) se cargaba a la vez desde systemd-modules-load y desde un udev-worker
# disparado por el coldplug -> "Driver 'apsys-dvfs' is already registered" y, a veces, NULL en devfreq_add_governor (panic a los ~26 s). Con esto el coldplug de udev
# empieza cuando modules-load ya termino.
After=systemd-modules-load.service
