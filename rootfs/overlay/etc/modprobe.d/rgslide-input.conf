# singleadcjoy registra el driver SPI del MCU (que fija g_smd) y el del joypad en el mismo init. Si spi0.0 (lo crea spi_sprd) aun no
# existe, joypad_probe corre con g_smd == NULL y custom_led_setting lo desreferencia (panic, ver docs/quirks.md INCIDENTE).
# blacklist: udev NO lo autocarga por el alias del DT; lo carga por nombre rgslide-input-prep cuando spi0.0 ya esta.
blacklist singleadcjoy
softdep singleadcjoy pre: spi_sprd sc27xx_adc
