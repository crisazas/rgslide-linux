# apsys_dvfs y mmdvfs registran AMBOS un gobernador devfreq llamado "vdsp_dvfs". Si mmdvfs va primero, el init de apsys_dvfs falla con -22 sin
# deshacer lo registrado (dpu/gsp + drivers de plataforma) y el siguiente modprobe de apsys_dvfs revienta en devfreq_add_governor (panic, ver docs/agent-panic.md).
# Con este softdep, cualquier modprobe de mmdvfs (alias of:...hwdvfs-*, o dependencia de sprd_vdsp) carga antes apsys_dvfs. No afecta a insmod del init.
# Deshacer: sudo rm /etc/modprobe.d/rgslide-dvfs.conf
softdep mmdvfs pre: apsys_dvfs
