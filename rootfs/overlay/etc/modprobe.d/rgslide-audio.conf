# El codec ump9620 se autocarga por modalias (udev) ~4 s antes de que existan los reguladores
# SRG_* (los crea snd-soc-sprd-codec-ump9620-power-dev). Sin ellos el codec toma reguladores
# dummy (VB, BIAS, DAHPL_CHN, HEADMICBIAS): la calibracion DC del DAC de HP/AO falla (-110),
# no hay reloj IIS hacia la VBC, el DMA no avanza (hw_ptr fijo) y el altavoz solo da estatica.
# Forzar que los reguladores esten antes del codec, como en el orden de fabrica.
softdep snd_soc_sprd_codec_ump9620 pre: snd_soc_sprd_codec_ump9620_power snd_soc_sprd_codec_ump9620_power_dev
