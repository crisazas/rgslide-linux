# Atajo "abrir Ajustes desde un juego" (rgslide-hotkeyd). Los numeros son codigos de evdev (linux/input-event-codes.h).
# 314 = BTN_SELECT (boton 10)   68 = KEY_F10 (boton HOME, a la izquierda junto a la pantalla; medido con una captura real, 2026-11-26)   158 = KEY_BACK (boton 20)
# Por defecto Select+Home: NO incluye el Back (20). Back es el boton del menu de RetroArch y el modificador de sus hotkeys; con Back+Select a veces se colaba
# el menu del nucleo, y L3+R3 resultaba incomodo (probado por el usuario).
COMBO=314,68
# milisegundos que hay que mantener el combo
HOLD_MS=200
# emuladores que no son RetroArch (sin estados): segundos para repetir el combo y confirmar el cierre
CONFIRM_S=4
