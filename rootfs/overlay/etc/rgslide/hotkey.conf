# Atajo "abrir Ajustes desde un juego" (rgslide-hotkeyd). Los numeros son codigos de evdev (linux/input-event-codes.h).
# 317 = BTN_THUMBL (L3, boton 13 de RetroArch)   318 = BTN_THUMBR (R3, boton 14)   158 = KEY_BACK (boton 20)   314 = BTN_SELECT   315 = BTN_START
# Por defecto L3+R3 (pulsar los dos sticks): NO incluye el Back (20). Back es el boton del menu de RetroArch y el modificador de sus hotkeys, y con
# Back+Select a veces se colaba el menu del nucleo (probado por el usuario, 2026-11-26).
COMBO=317,318
# milisegundos que hay que mantener el combo
HOLD_MS=300
# emuladores que no son RetroArch (sin estados): segundos para repetir el combo y confirmar el cierre
CONFIRM_S=4
