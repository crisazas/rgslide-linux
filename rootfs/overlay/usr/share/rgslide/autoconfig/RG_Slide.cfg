# RG Slide (Unisoc T820): evdev "retrogame_joypad" (singleadcjoy.ko), bus 0x19, vid 0x484b, pid 0x1101.
# Indices del driver udev de RetroArch (udev_joypad.c asigna indices a las teclas anunciadas en este orden):
#  0 BTN_SOUTH(0x130)  1 BTN_EAST(0x131)  2 BTN_C(0x132)  3 BTN_NORTH(0x133)  4 BTN_WEST(0x134)  5 BTN_Z(0x135)
#  6 BTN_TL  7 BTN_TR  8 BTN_TL2  9 BTN_TR2  10 BTN_SELECT  11 BTN_START  12 BTN_MODE  13 BTN_THUMBL  14 BTN_THUMBR
#  15-18 BTN_DPAD_UP/DOWN/LEFT/RIGHT(0x220-0x223)  19 KEY_F10(0x44)  20 KEY_BACK(0x9e)
# Ejes: 0 ABS_X 1 ABS_Y (stick izq) 2 ABS_Z (gatillo, 0..16384) 3 ABS_RX 4 ABS_RY (stick der) 5 ABS_RZ (gatillo); hat0 = ABS_HAT0X/Y.
# Las etiquetas A/B/X/Y siguen el rotulado del DT del fabricante (BTN-A=0x134, BTN-B=0x131, BTN-X=0x133, BTN-Y=0x130).
# A=0 e Y=4 (lo que el usuario configuro en EmulationStation; antes iban al reves, segun el rotulado del DT del fabricante). Alineado con es_input.cfg.
# SIN PROBAR con pulsaciones reales.
input_driver = "udev"
input_device = "retrogame_joypad"
input_device_display_name = "RG Slide"
input_vendor_id = "18507"
input_product_id = "4353"

input_a_btn = "0"
input_b_btn = "1"
input_x_btn = "3"
input_y_btn = "4"
input_select_btn = "10"
input_start_btn = "11"
input_l_btn = "6"
input_r_btn = "7"
input_l2_btn = "8"
input_r2_btn = "9"
input_l3_btn = "13"
input_r3_btn = "14"
input_up_btn = "h0up"
input_down_btn = "h0down"
input_left_btn = "h0left"
input_right_btn = "h0right"
input_l_x_plus_axis = "+0"
input_l_x_minus_axis = "-0"
input_l_y_plus_axis = "+1"
input_l_y_minus_axis = "-1"
input_r_x_plus_axis = "+3"
input_r_x_minus_axis = "-3"
input_r_y_plus_axis = "+4"
input_r_y_minus_axis = "-4"
input_menu_toggle_btn = "20"
# Salir del juego y volver a EmulationStation: boton 20 (Back, el mismo que abre el menu) + Start. Para que el 20 sea el "hotkey" hace falta input_enable_hotkey_btn.
input_enable_hotkey_btn = "20"
input_exit_emulator_btn = "11"

input_a_btn_label = "A"
input_b_btn_label = "B"
input_x_btn_label = "X"
input_y_btn_label = "Y"
input_select_btn_label = "Select"
input_start_btn_label = "Start"
input_l_btn_label = "L1"
input_r_btn_label = "R1"
input_l2_btn_label = "L2"
input_r2_btn_label = "R2"
input_l3_btn_label = "L3"
input_r3_btn_label = "R3"
input_up_btn_label = "D-Pad Up"
input_down_btn_label = "D-Pad Down"
input_left_btn_label = "D-Pad Left"
input_right_btn_label = "D-Pad Right"
input_menu_toggle_btn_label = "Back"
