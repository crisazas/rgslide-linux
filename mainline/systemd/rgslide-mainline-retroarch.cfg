# Mainline Linux 6.18 + Mesa Panfrost KMS overrides for RetroArch on RG Slide
video_driver = "gl"
video_context_driver = "kms"
video_monitor_index = "0"
video_fullscreen = "true"
video_fullscreen_x = "1280"
video_fullscreen_y = "960"
video_vsync = "true"
libretro_directory = "/opt/retroarch/lib/libretro"
audio_driver = "alsa"
audio_device = "rgslide"
input_driver = "udev"
input_joypad_driver = "udev"
